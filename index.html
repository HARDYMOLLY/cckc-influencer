<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCKC 인플루언서 — 연결 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Pretendard", -apple-system, sans-serif;
    background: #f7f7f5; color: #1a1a1a;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 460px; background: #fff;
    border: 0.5px solid #e3e1da; border-radius: 16px; padding: 28px;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #E24B4A; }
  .brand span { font-size: 15px; font-weight: 600; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #76746c; margin: 0 0 22px; }
  .status {
    display: flex; align-items: center; gap: 10px;
    padding: 16px; border-radius: 12px; background: #f1efe8;
    font-size: 15px; font-weight: 500; margin-bottom: 14px;
  }
  .status.ok { background: #e1f5ee; color: #0f6e56; }
  .status.fail { background: #fcebeb; color: #a32d2d; }
  .spin {
    width: 16px; height: 16px; border: 2px solid #c9c7be; border-top-color: #76746c;
    border-radius: 50%; animation: r 0.8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .meta { font-size: 12px; color: #76746c; line-height: 1.8; }
  .meta b { color: #1a1a1a; font-weight: 500; }
  code { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span><span>CCKC 인플루언서 매니저</span></div>
    <h1>0단계 · 연결 테스트</h1>
    <p class="sub">앱이 Firestore 데이터베이스에 제대로 연결됐는지 확인합니다.</p>

    <div class="status" id="status">
      <span class="spin"></span>
      <span id="statusText">연결 확인 중…</span>
    </div>

    <div class="meta" id="meta">
      프로젝트: <b id="proj">—</b>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCDRt36nsZ3Lz7HPnhiuM4oz65K_L8ZtGI",
    authDomain: "cckc-influencer.firebaseapp.com",
    projectId: "cckc-influencer",
    storageBucket: "cckc-influencer.firebasestorage.app",
    messagingSenderId: "107148864410",
    appId: "1:107148864410:web:452630d0fa500fbe90a823"
  };

  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const meta = document.getElementById("meta");
  document.getElementById("proj").textContent = firebaseConfig.projectId;

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    await setDoc(doc(db, "_healthcheck", "ping"), {
      at: serverTimestamp(),
      from: "0단계 연결 테스트"
    });
    const snap = await getDoc(doc(db, "_healthcheck", "ping"));

    statusEl.className = "status ok";
    statusText.textContent = "✅ Firestore 연결 성공";
    meta.innerHTML = `프로젝트: <b>${firebaseConfig.projectId}</b><br>읽기/쓰기: <b>정상</b> (테스트 문서 생성·조회 완료)<br>이제 Firestore에 <b>_healthcheck</b> 컬렉션이 보일 거예요.`;
  } catch (e) {
    statusEl.className = "status fail";
    statusText.textContent = "❌ 연결 실패";
    meta.innerHTML = `프로젝트: <b>${firebaseConfig.projectId}</b><br>오류: <code>${e.message}</code>`;
  }
</script>
</body>
</html>
