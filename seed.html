const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const log=document.getElementById('log'); const btn=document.getElementById('run');
function p(t,c){const d=document.createElement('div'); if(c)d.className=c; d.textContent=t; log.appendChild(d);}
window.runSeed=async()=>{
  btn.disabled=true; btn.textContent='주입 중…'; log.innerHTML='';
  try{
    const cid=SEED.campaign.id;
    await setDoc(doc(db,'campaigns',cid),{...SEED.campaign, createdAt:serverTimestamp()});
    p('✓ 캠페인 문서 생성');
    for(const a of SEED.angles){ await setDoc(doc(db,'campaigns',cid,'angles',a.id),a); }
    p('✓ 앵글 '+SEED.angles.length+'개');
    let n=0;
    for(const inf of SEED.influencers){
      await setDoc(doc(db,'campaigns',cid,'influencers','inf_'+inf.order), inf);
      n++; if(n%6===0) p('  인플루언서 '+n+'/'+SEED.influencers.length);
    }
    p('✓ 인플루언서 '+n+'명');
    p('🎉 시드 완료! Firestore에서 campaigns 컬렉션 확인하세요.','ok');
    btn.textContent='완료';
  }catch(e){ p('❌ 실패: '+e.message,'fail'); btn.disabled=false; btn.textContent='다시 시도'; }
};
